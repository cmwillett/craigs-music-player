<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Songs">
  <title>Craig's Songs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a href="admin.html" class="corner-link" aria-label="Admin"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.3 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><span>Admin</span></a>
    <h1><span id="app-title">Craig's Songs</span> <span id="app-version" class="version"></span></h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="songs" role="tab">Songs</button>
      <button class="tab" data-view="playlists" role="tab">Playlists</button>
    </nav>
  </header>

  <main>
    <div id="install-banner" class="install" hidden>
      <img src="icons/icon-192.png" alt="" class="install-icon">
      <div class="install-text">
        <strong>Install Craig's Songs</strong>
        <span id="install-help">Add it to your home screen for one-tap listening.</span>
      </div>
      <button id="install-btn" class="install-go">Install</button>
      <button id="install-close" class="install-x" aria-label="Not now">✕</button>
    </div>

    <section id="view-songs" class="view">
      <div class="filters">
        <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
        <label class="sort">Sort
          <select id="sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="title">Title A–Z</option>
            <option value="category">By category</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button id="play-all" class="pill">▶ Play these</button>
        <button id="shuffle-all" class="pill">⤮ Shuffle</button>
        <span id="count" class="count"></span>
      </div>
      <div id="song-list"></div>
    </section>

    <section id="view-playlists" class="view" hidden>
      <div id="playlist-index">
        <h2>Playlists</h2>
        <ul id="app-playlists" class="list"></ul>
        <h2>On YouTube <span class="sub">(videos with lyrics)</span></h2>
        <ul id="yt-playlists" class="list"></ul>
        <div id="sp-section" hidden>
          <h2>On Spotify</h2>
          <ul id="sp-playlists" class="list"></ul>
        </div>
      </div>
      <div id="playlist-detail" hidden>
        <button id="pl-back" class="back">← All playlists</button>
        <h2 id="pl-name" class="pl-name"></h2>
        <div class="actions">
          <button id="pl-play" class="pill">▶ Play</button>
          <button id="pl-shuffle" class="pill">⤮ Shuffle</button>
          <span id="pl-count" class="count"></span>
        </div>
        <ul id="pl-songs" class="list"></ul>
      </div>
    </section>
  </main>

  <footer id="player" class="player" hidden>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <div class="player-row">
      <img id="np-cover" class="cover small" alt="">
      <div class="np-text">
        <div id="np-title" class="np-title"></div>
        <div id="np-source" class="np-source" hidden></div>
        <div id="np-time" class="np-time">0:00 / 0:00</div>
      </div>
      <div class="controls">
        <button id="prev" aria-label="Previous">⏮</button>
        <button id="toggle" class="big" aria-label="Play or pause">▶</button>
        <button id="next" aria-label="Next">⏭</button>
      </div>
    </div>
  </footer>

  <div id="video-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="video-title">
    <div class="modal-box">
      <div class="modal-head">
        <div id="video-title" class="modal-title"></div>
        <button id="video-close" class="modal-x" aria-label="Close">✕</button>
      </div>
      <div id="video-frame" class="video-frame"></div>
      <a id="video-open" class="modal-link" target="_blank" rel="noopener">Open in YouTube ↗</a>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>
  <script src="version.js"></script>
  <script src="app.js"></script>
</body>
</html>
