<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Songs">
  <title>Craig's Songs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 id="app-title">Craig's Songs</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="songs" role="tab">Songs</button>
      <button class="tab" data-view="playlists" role="tab">Playlists</button>
    </nav>
  </header>

  <main>
    <section id="view-songs" class="view">
      <div class="actions">
        <button id="play-all" class="pill">▶ Play all</button>
        <button id="shuffle-all" class="pill">⤮ Shuffle</button>
      </div>
      <ul id="song-list" class="list"></ul>
    </section>

    <section id="view-playlists" class="view" hidden>
      <h2>In this app</h2>
      <ul id="app-playlists" class="list"></ul>
      <h2>On YouTube <span class="sub">(videos with lyrics)</span></h2>
      <ul id="yt-playlists" class="list"></ul>
      <p style="margin-top:40px;text-align:center"><a href="admin.html" style="color:var(--muted);font-size:.8rem">Admin</a></p>
    </section>
  </main>

  <footer id="player" class="player" hidden>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <div class="player-row">
      <img id="np-cover" class="cover small" alt="">
      <div class="np-text">
        <div id="np-title" class="np-title"></div>
        <div id="np-time" class="np-time">0:00 / 0:00</div>
      </div>
      <div class="controls">
        <button id="prev" aria-label="Previous">⏮</button>
        <button id="toggle" class="big" aria-label="Play or pause">▶</button>
        <button id="next" aria-label="Next">⏭</button>
      </div>
    </div>
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
